[package]
name = "gha-clone-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
hex = "0.4"
hmac = "0.12"
# ores-otel next-loggers Rust SDK (requires Rust 1.88), pinned to an immutable
# commit whose exact serde_json pin matches this lockfile.
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "a5ec8812df692ccc3bdcaaf89d984c44714970d5" }
reqwest = { version = "=0.12.9", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
yaml-rust2 = "=0.11.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
