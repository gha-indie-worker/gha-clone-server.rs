name: Promote validated dev to main with gh once

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/promote-dev-to-main-with-gh-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-validated-dev-to-main-once
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: gha-indie-worker/gha-clone-server.rs
    steps:
      - name: Check out validated dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify validated integration head and permanent CI
        run: |
          set -euo pipefail
          expected_parent='26cc273d1a6c2b25c51d42f4c767baba510aefe3'
          git merge-base --is-ancestor "$expected_parent" HEAD
          conclusion="$(gh run list \
            --repo "$GH_REPO" \
            --workflow CI \
            --branch dev \
            --commit "$expected_parent" \
            --json conclusion \
            --limit 1 \
            --jq '.[0].conclusion')"
          test "$conclusion" = success

      - name: Remove the one-time carrier before opening the promotion
        run: |
          set -euo pipefail
          rm .github/workflows/promote-dev-to-main-with-gh-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: remove protected-main promotion carrier'
          git push origin HEAD:dev

      - name: Replace the owner-authored promotion with a bot-authored PR
        id: promotion
        run: |
          set -euo pipefail
          if gh pr view 3 --repo "$GH_REPO" --json state --jq .state | grep -qx OPEN; then
            gh pr close 3 \
              --repo "$GH_REPO" \
              --comment 'Superseded by a bot-authored promotion PR so the repository owner can provide the required independent write-access approval without weakening branch protection.'
          fi

          url="$(gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head dev \
            --title 'Promote validated bounded continuity contract to main' \
            --body-file - <<'EOF'
## Promotion

Promote the validated `dev` integration branch to protected `main`.

This PR is intentionally authored by `github-actions[bot]` so the repository owner can provide the independently attributable write-access approval required by the protected branch. No protection or review rule is bypassed.

## Included integration

- feature PR: #2
- validated feature head: `5d8f4c00ea359c495b4bc997b29ce22cfc9c9c4f`
- integration merge: `26cc273d1a6c2b25c51d42f4c767baba510aefe3`
- permanent `CI` on the integration merge: green
- Linear: DEN-1606

## Safety boundary

The promotion preserves the bounded fixed-profile continuity model, fail-closed workflow exclusions, atomic admission, single-replica delivery limits, credential separation, dormant activation, and Fiducia-backed scaling gates. It does not claim full GitHub Actions parity.

Merge only after an independent write-access approval and exact-head protected checks pass.
EOF
          )"
          number="$(gh pr view "$url" --repo "$GH_REPO" --json number --jq .number)"
          head_sha="$(git rev-parse HEAD)"
          printf 'url=%s\nnumber=%s\nhead_sha=%s\n' "$url" "$number" "$head_sha" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg schema_version 'gha-indie-worker.promotion.v1' \
            --arg repository "$GH_REPO" \
            --arg source_branch dev \
            --arg target_branch main \
            --arg source_sha "$head_sha" \
            --arg integration_sha '26cc273d1a6c2b25c51d42f4c767baba510aefe3' \
            --arg pull_request_url "$url" \
            --argjson pull_request_number "$number" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:$schema_version,repository:$repository,source_branch:$source_branch,target_branch:$target_branch,source_sha:$source_sha,integration_sha:$integration_sha,pull_request_number:$pull_request_number,pull_request_url:$pull_request_url,created_at:$created_at,review_required:true,protection_bypassed:false}' \
            > promotion-evidence.json

      - name: Publish promotion evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protected-main-promotion-${{ steps.promotion.outputs.number }}
          path: promotion-evidence.json
          if-no-files-found: error
          retention-days: 14
