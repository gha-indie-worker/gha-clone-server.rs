name: Formal Wave 6
on:
  pull_request:
  push:
    branches: [formal/multi-method-wave6-20260925]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact PR candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head and source tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --quiet --exit-code
          echo "SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Compile and execute Rust exhaustive model and negative mutations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          rustc +1.90.0 --edition=2021 --test conformance/formal_wave6_model.rs -o "$RUNNER_TEMP/clone-temporal-tests"
          "$RUNNER_TEMP/clone-temporal-tests" 2>&1 | tee evidence/clone-temporal-tests.log
          grep -F 'test result: ok. 5 passed; 0 failed;' evidence/clone-temporal-tests.log
          rustc +1.90.0 --edition=2021 conformance/formal_wave6_model.rs -o "$RUNNER_TEMP/clone-temporal-model"
          "$RUNNER_TEMP/clone-temporal-model" | tee evidence/clone-temporal-1.txt
          "$RUNNER_TEMP/clone-temporal-model" > evidence/clone-temporal-2.txt
          cmp evidence/clone-temporal-1.txt evidence/clone-temporal-2.txt
          grep -E '^CLONE_TEMPORAL_MODEL_PASS legal=[0-9]+ traces=256$' evidence/clone-temporal-1.txt
      - name: Retain exact-head model execution receipt
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          jq -n --arg head "$EXPECTED_HEAD" \
            --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg model "$(git rev-parse 'HEAD:conformance/formal_wave6_model.rs')" \
            --arg log "$(sha256sum evidence/clone-temporal-tests.log | cut -d' ' -f1)" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{schema:"gha-clone-temporal-v1",source:{head:$head,tree:$tree,modelBlob:$model},
              run:{id:$run,attempt:($attempt|tonumber)},tracesExplored:256,
              negativeMutationTests:4,modelTests:5,status:"passed",
              testLogSha256:$log,productionCloneExecution:"NOT_EXECUTED",
              attoGuestExecution:"NOT_EXECUTED"}' > evidence/clone-temporal-receipt.json
          jq -e '.schema == "gha-clone-temporal-v1"
            and .tracesExplored == 256
            and .negativeMutationTests == 4
            and .modelTests == 5
            and .status == "passed"
            and .source.tree != ""
            and .run.attempt >= 1
            and .productionCloneExecution == "NOT_EXECUTED"' evidence/clone-temporal-receipt.json
      - name: Upload temporal proof evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clone-temporal-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
