            -o /tmp/gha-router-denial.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            --data '{"schemaVersion":"build-server.v1"}' \
            http://127.0.0.1:18126/builds)"
          test "$status" = 401
 Dockerfile
          grep -Fxq 'ARG OCI_SOURCE=https://github.com/gha-indie-worker/gha-clone-server.rs' Dockerfile
          grep -Fq 'USER 65532:65532' Dockerfile
          grep -Fq 'FROM runtime AS clone-server' Dockerfile
