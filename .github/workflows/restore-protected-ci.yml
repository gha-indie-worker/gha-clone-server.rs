            fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          with open('/tmp/gha-router-ready.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data['ok'] is True and data['service'] == 'gha-executor-router', data
          assert data['executionEnabled'] is False and data['executionReady'] is True, data
          assert data['readyExecutors'] == [], data
          PY
          curl --fail --silent --show-error --max-time 3 \
            http://127.0.0.1:18126/healthz -o /tmp/gha-router-health.json
          python3 - <<'PY'
          import json
