name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gha-clone-server-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: fmt, clippy, test, release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all

      - name: Build release binaries
        run: cargo build --locked --release --all-features

  hardened-images:
    name: hardened images and live smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Build both immutable runtime targets
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          created="$(git show -s --format=%cI HEAD)"
          docker build \
            --target clone-server \
            --build-arg OCI_REVISION="$revision" \
            --build-arg OCI_CREATED="$created" \
            --build-arg OCI_SOURCE="https://github.com/${GITHUB_REPOSITORY}" \
            --tag gha-clone-server:ci \
            .
          docker build \
            --target executor-router \
            --build-arg OCI_REVISION="$revision" \
            --build-arg OCI_CREATED="$created" \
            --build-arg OCI_SOURCE="https://github.com/${GITHUB_REPOSITORY}" \
            --tag gha-executor-router:ci \
            .
          test "$(docker image inspect gha-clone-server:ci --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect gha-executor-router:ci --format '{{.Config.User}}')" = '65532:65532'
          test "$(docker image inspect gha-clone-server:ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/gha-clone-server"]'
          test "$(docker image inspect gha-executor-router:ci --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/gha-executor-router"]'

      - name: Smoke the clone-server image with execution disabled
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name gha-clone-server-ci \
            --publish 18125:8125 \
            --env HOST=0.0.0.0 \
            --env PORT=8125 \
            --env GHA_CLONE_AUTH_SECRET=ci-only-auth \
            --env GHA_CLONE_ALLOWED_REPOSITORIES=gha-indie-worker/gha-clone-server.rs \
            --env GHA_CLONE_WORKFLOW_RULES_JSON='{}' \
            --env GHA_CLONE_EXECUTION_ENABLED=false \
            --env GHA_CLONE_WEBHOOK_EXECUTION_ENABLED=false \
            gha-clone-server:ci
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18125/healthz >/dev/null && \
               curl --fail --silent http://127.0.0.1:18125/readyz >/dev/null; then
              exit 0
            fi
            if ! docker inspect gha-clone-server-ci >/dev/null 2>&1; then
              docker logs gha-clone-server-ci >&2 || true
              exit 1
            fi
            sleep 1
          done
          docker logs gha-clone-server-ci >&2 || true
          exit 1

      - name: Stop smoke container
        if: always()
        run: docker rm -f gha-clone-server-ci >/dev/null 2>&1 || true

  secret-scan:
    name: full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Install checksum-pinned Gitleaks OSS binary
        shell: bash
        run: |
          set -euo pipefail
          version='8.30.1'
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/$archive" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          test "$("$RUNNER_TEMP/gitleaks" version)" = "$version"

      - name: Scan complete Git history for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
