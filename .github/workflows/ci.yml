name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gha-clone-server-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: .github/workflows/ci.yml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --locked --all-targets
      - name: Prove webhook registration secret boundary
        run: |
          set -euo pipefail
          bash -n scripts/register-github-webhook.sh
          bash -n tests/register_github_webhook.sh
          bash tests/register_github_webhook.sh
      - name: Reject committed credentials
        run: |
          set -euo pipefail
          if grep -RIE \
            --exclude='ci.yml' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|BEGIN (RSA |EC )?PRIVATE KEY' \
            .github scripts tests README.md SOURCE_PROVENANCE.md; then
            echo 'credential-like material found in the standalone repository' >&2
            exit 1
          fi
