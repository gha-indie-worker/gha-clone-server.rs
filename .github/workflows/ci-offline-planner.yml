name: Offline workflow planner CLI regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-offline-planner.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci-offline-planner.yml'
permissions:
  contents: read
concurrency:
  group: offline-planner-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR tree without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify Rust format
        run: cargo fmt --all -- --check
      - name: Run offline planner integration and library tests
        run: cargo test --all-targets --locked
      - name: Clippy all targets
        run: cargo clippy --all-targets --locked -- -D warnings
