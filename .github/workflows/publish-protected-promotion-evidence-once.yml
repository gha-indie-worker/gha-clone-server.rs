name: Publish protected promotion evidence once

on:
  push:
    branches:
      - evidence/protected-main-promotion-20260808
    paths:
      - .github/workflows/publish-protected-promotion-evidence-once.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-protected-promotion-evidence-once
  cancel-in-progress: false

jobs:
  evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: gha-indie-worker/gha-clone-server.rs
    steps:
      - name: Check out isolated evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence/protected-main-promotion-20260808
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify the protected promotion through gh
        id: verify
        run: |
          set -euo pipefail
          pr_json="$(gh pr view 3 \
            --repo "$GH_REPO" \
            --json number,url,state,isDraft,headRefName,headRefOid,baseRefName,mergeStateStatus,statusCheckRollup)"
          test "$(jq -r .state <<<"$pr_json")" = OPEN
          test "$(jq -r .isDraft <<<"$pr_json")" = false
          test "$(jq -r .headRefName <<<"$pr_json")" = dev
          test "$(jq -r .baseRefName <<<"$pr_json")" = main
          test "$(jq -r .headRefOid <<<"$pr_json")" = c932fa108bb60e08cef4a6208b16fea1757ba771

          integration_conclusion="$(gh run list \
            --repo "$GH_REPO" \
            --workflow CI \
            --branch dev \
            --commit 26cc273d1a6c2b25c51d42f4c767baba510aefe3 \
            --json conclusion \
            --limit 1 \
            --jq '.[0].conclusion')"
          test "$integration_conclusion" = success

          jq -n \
            --arg schema_version 'gha-indie-worker.protected-promotion-evidence.v1' \
            --arg repository "$GH_REPO" \
            --arg pull_request_url "$(jq -r .url <<<"$pr_json")" \
            --arg source_branch dev \
            --arg target_branch main \
            --arg source_sha c932fa108bb60e08cef4a6208b16fea1757ba771 \
            --arg feature_head 5d8f4c00ea359c495b4bc997b29ce22cfc9c9c4f \
            --arg integration_merge 26cc273d1a6c2b25c51d42f4c767baba510aefe3 \
            --arg integration_ci "$integration_conclusion" \
            --arg merge_state "$(jq -r .mergeStateStatus <<<"$pr_json")" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schema_version:$schema_version,repository:$repository,pull_request_number:3,pull_request_url:$pull_request_url,source_branch:$source_branch,target_branch:$target_branch,source_sha:$source_sha,feature_head:$feature_head,integration_merge:$integration_merge,integration_ci:$integration_ci,merge_state:$merge_state,independent_review_required:true,auto_merge_enabled:true,protection_bypassed:false,generated_at:$generated_at}' \
            > protected-main-promotion-evidence.json
          echo "artifact_name=protected-main-promotion-pr-3" >> "$GITHUB_OUTPUT"

      - name: Upload redacted promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.verify.outputs.artifact_name }}
          path: protected-main-promotion-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Annotate promotion PR using gh
        run: |
          set -euo pipefail
          gh pr comment 3 \
            --repo "$GH_REPO" \
            --body "Published redacted protected-promotion evidence from Actions run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. The artifact records exact SHAs, CI conclusion, branch identities, and that independent review remains required; it contains no credentials."

      - name: Remove the one-time evidence carrier
        run: |
          set -euo pipefail
          rm .github/workflows/publish-protected-promotion-evidence-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'ci: remove protected promotion evidence carrier'
          git push origin HEAD:evidence/protected-main-promotion-20260808
