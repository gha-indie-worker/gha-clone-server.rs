name: Evento Globolo Rust CI

on:
  push:
    branches: [dev, main]
    paths:
      - 'ci/evento-source.part*'
      - '.github/workflows/evento-rust-ci.yml'
  pull_request:
    paths:
      - 'ci/evento-source.part*'
      - '.github/workflows/evento-rust-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - name: Rehydrate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/work
          cat ci/evento-source.part* | base64 --decode > ci/evento-source.tar.gz
          echo '765e12906fcae17859a42eca66301e0be9a308bd2255938955c596784956e272  ci/evento-source.tar.gz' | sha256sum --check
          tar -xzf ci/evento-source.tar.gz -C ci/work
          git apply --check --directory=ci/work ci/evento-compat.patch
          git apply --directory=ci/work ci/evento-compat.patch
      - name: Format source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path ci/work/evgl-interfaces/Cargo.toml --all
          cargo fmt --manifest-path ci/work/evgl-api/Cargo.toml --all
          tar -czf ci/evento-formatted-source.tar.gz -C ci/work evgl-interfaces evgl-api
      - name: Upload formatted source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evento-formatted-source
          path: ci/evento-formatted-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Test interfaces
        run: cargo test --manifest-path ci/work/evgl-interfaces/Cargo.toml --all-targets
      - name: Test API
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path ci/work/evgl-api/Cargo.toml --all-targets 2>&1 | tee ci/api-test.log
      - name: Upload API compiler log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evento-api-test-log
          path: ci/api-test.log
          if-no-files-found: warn
          retention-days: 1
      - name: Clippy interfaces
        run: cargo clippy --manifest-path ci/work/evgl-interfaces/Cargo.toml --all-targets -- -D warnings
      - name: Clippy API
        run: cargo clippy --manifest-path ci/work/evgl-api/Cargo.toml --all-targets -- -D warnings
